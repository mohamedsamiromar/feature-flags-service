services:

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - .:/app
    # Loopback only: this is `runserver`, usually with DEBUG=True, and on
    # 0.0.0.0 anyone on the network could reach it (sending `Host: localhost`
    # satisfies ALLOWED_HOSTS) and read debug pages. Override WEB_PORT in .env
    # to run alongside another stack on 8000.
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: feature_flags
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Loopback only: published on 0.0.0.0 this is reachable from the LAN with
    # the default postgres/postgres credentials. The host port stays so tests
    # can run outside Docker (see AGENTS.md).
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feature_flags"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # Fails fast at `docker compose up` if REDIS_PASSWORD is missing, rather
    # than silently starting an open Redis.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    # Loopback only: Django's cache pickles what it stores, so anyone who can
    # write a `flags:*` key gets code execution in the web process. Host port
    # 6380, not 6379, so this stack can run alongside another project's Redis;
    # containers reach it as redis:6379 over the compose network regardless.
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build: .
    command: celery -A config beat --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

# Named volumes so `docker compose down` stops the stack without destroying the
# database. Use `docker compose down -v` when you actually want a clean slate.
volumes:
  postgres_data:
  redis_data:
